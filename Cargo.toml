[package]
name = "nsh-app-listenook"
version = "2.3.1"
edition = "2024"
publish = false

[[bin]]
name = "Listenook"
path = "src/main.rs"

[workspace]
members = ["crates/listenook-core"]
exclude = ["vendor"]

[dependencies]
listenook-core = { path = "crates/listenook-core" }
nsh-core = { version = "0.7.0" }
nsh-base = { version = "0.7.0" }
log = "0.4"
serde_json = "1"
serde = "1"
ureq = "2"
sha2 = "0.10"
matrixmultiply = { version = "0.3", features = ["threading"] }
symphonia = { version = "0.5", default-features = false, features = ["aac", "alac", "flac", "isomp4", "mkv", "mp3", "ogg", "pcm", "vorbis", "wav"] }
# Decodes Opus, which symphonia 0.5 cannot. It is written for symphonia 0.6, whose readers open
# fewer files than 0.5's (some HEVC MP4s, MKVs with chapters), so 0.5 still reads the files.
symphonia-opus = "0.1.3"
symphonia-next = { package = "symphonia-core", version = "0.6.1" }
zip = { version = "2", default-features = false, features = ["deflate"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", default-features = false, features = ["sync"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["ring"] }
spake2 = "0.4"
if-addrs = "0.15"
socket2 = "0.6"

# Only the desktop binary (src/main.rs) prints its log; phones and tablets log through nsh.
[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
env_logger = "0.11"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.7.0", default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term", "svg", "net", "updater"] }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.7.0", default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term", "svg", "updater"] }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.7.0", default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term", "svg", "net", "media", "updater"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_Media_KernelStreaming", "Win32_Media_MediaFoundation", "Win32_Media_Multimedia", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell"] }
png = "0.18"

[dev-dependencies]
nsh-engine = { version = "0.7.0", default-features = false }
nsh-testing = { version = "0.7.0", default-features = false }

[target.'cfg(target_vendor = "apple")'.dependencies]
qwen-asr = { path = "vendor/qwen-asr" }

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
qwen-asr = { path = "vendor/qwen-asr", default-features = false, features = ["blas"] }

# Dependencies are built lightly optimized even in development: unoptimized, they make so many
# small functions that the macOS linker can no longer index the binary's unwind tables (over
# 16 MB of __eh_frame), and they run the headless tests slowly. This app's own code stays
# unoptimized for debugging.
[profile.dev.package."*"]
opt-level = 1

[profile.dev.package.qwen-asr]
opt-level = 3

[profile.dev.package.matrixmultiply]
opt-level = 3

[profile.dev.package.symphonia-core]
opt-level = 3

[profile.dev.package.symphonia-opus]
opt-level = 3

[profile.dev.package.listenook-core]
opt-level = 2
